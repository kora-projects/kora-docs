<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found | Kora Framework</title>
    <meta name="robots" content="noindex">
    <style>
        body {margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #090a09; color: #f7f3ea; font-family: ui-sans-serif, system-ui, sans-serif; text-align: center; padding: 16px;}
        a {color: #ffb02e;}
    </style>
    <script>
        (function () {
            // Fallback for addresses from the old GitHub Pages location that
            // have no generated stub (GitHub forwards kora-projects.github.io/
            // kora-docs/* to koraframework.io/kora-docs/*):
            //   /kora-docs/<lang>/<path> (pre-v1/v2 docs) -> /v1/<lang>/<path>
            //   /kora-docs/<anything>                     -> /<anything>
            var path = location.pathname, target = null;
            var legacy = path.match(/^\/kora-docs\/(ru|en)\/(.+)$/);
            if (legacy) target = "/v1/" + legacy[1] + "/" + legacy[2];
            else if (path.indexOf("/kora-docs/") === 0) target = path.substring("/kora-docs".length);
            if (target) location.replace(target + location.search + location.hash);
        })();
    </script>
</head>
<body>
<div>
    <h1>Page not found</h1>
    <p>This page moved or no longer exists.</p>
    <p><a href="/">Kora Framework</a> · <a href="/ru/" lang="ru">Kora на русском</a></p>
</div>
</body>
</html>
